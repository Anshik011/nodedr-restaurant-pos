services:
  - type: web
    name: restaurant-pos-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install --prod && cd apps/backend && npx prisma generate && cd ../..
    startCommand: cd apps/backend && npx prisma migrate deploy && node dist/prisma/seed.js && node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-pos-db
          property: connectionString

databases:
  - name: restaurant-pos-db
    plan: free
    region: oregon
    databaseName: nodedr_restaurant
    user: nodedr
