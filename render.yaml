services:
  - type: web
    name: restaurant-pos
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @nodedr-restaurant/types build && pnpm --filter @nodedr-restaurant/backend exec prisma generate && pnpm --filter @nodedr-restaurant/backend build && pnpm --filter web build
    startCommand: cd apps/backend && npx prisma migrate deploy && npx ts-node prisma/seed.ts && cd ../.. && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-pos-db
          property: connectionString

databases:
  - name: restaurant-pos-db
    plan: free
    region: oregon
    databaseName: nodedr_restaurant
    user: nodedr
