services:
  - type: web
    name: restaurant-pos
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install --prod=false && pnpm --filter @nodedr-restaurant/types build && cd apps/backend && npx prisma generate && npx nest build && cd ../web && pnpm build && cd ../..
    startCommand: cd apps/backend && npx prisma migrate deploy && npx ts-node prisma/seed.ts && cd ../.. && node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-pos-db
          property: connectionString

databases:
  - name: restaurant-pos-db
    plan: free
    region: oregon
    databaseName: nodedr_restaurant
    user: nodedr
